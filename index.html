<script>
  function capitalize (string) {
    return string[0].toUpperCase()+ string.slice(1)
  }
  console.log(capitalize("hello"))
</script>

<script>
  function lastLetter (string) {
    return string.slice(0, string.length - 1) + string[string.length - 1].toUpperCase() 
  }
  console.log(lastLetter("dragonite"))
</script>

<script>
  function createCallsign (string1,string2) {
    let a = string1.length + string2.length;
    return string1[0].toUpperCase()
   + "-" + string2.slice(- 1).toUpperCase() + a
  }
    console.log(createCallsign("devin","bravo"));
    
  
</script>
